name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ['8.0.x']
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: '**/TestResults/**'

  publish-raspberry-pi:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Publish AudioDemo for Raspberry Pi (ARM64)
      run: |
        dotnet publish tools/AudioDemo/AudioDemo.csproj \
          -c Release \
          -r linux-arm64 \
          --self-contained true \
          -o ./publish/AudioDemo-arm64
    
    - name: Publish AudioDemo for Raspberry Pi (ARM)
      run: |
        dotnet publish tools/AudioDemo/AudioDemo.csproj \
          -c Release \
          -r linux-arm \
          --self-contained true \
          -o ./publish/AudioDemo-arm
    
    - name: Upload ARM64 artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AudioDemo-raspberry-pi-arm64
        path: ./publish/AudioDemo-arm64
    
    - name: Upload ARM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AudioDemo-raspberry-pi-arm
        path: ./publish/AudioDemo-arm

  publish-tools:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Publish StreamDemo
      run: |
        dotnet publish tools/StreamDemo/StreamDemo.csproj \
          -c Release \
          -r linux-arm64 \
          --self-contained true \
          -o ./publish/StreamDemo
    
    - name: Publish PlatformInfo
      run: |
        dotnet publish tools/PlatformInfo/PlatformInfo.csproj \
          -c Release \
          -r linux-arm64 \
          --self-contained true \
          -o ./publish/PlatformInfo
    
    - name: Publish PerformanceDemo
      run: |
        dotnet publish tools/PerformanceDemo/PerformanceDemo.csproj \
          -c Release \
          -r linux-arm64 \
          --self-contained true \
          -o ./publish/PerformanceDemo
    
    - name: Upload tools artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tools-raspberry-pi-arm64
        path: ./publish/*
